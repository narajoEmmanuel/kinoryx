name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dashboard,dev]'
      - run: ruff check src apps tests
      - run: pytest -q
      - run: python -c "import importlib.util; s=importlib.util.spec_from_file_location('dashboard', 'apps/biomechanics_dashboard/app.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert m.create_app().layout is not None"
