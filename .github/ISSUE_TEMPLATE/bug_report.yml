name: Bug report
description: Report a reproducible problem without exposing sensitive participant data
title: "[Bug] "
body:
  - type: textarea
    id: issue
    attributes:
      label: Observed issue and steps to reproduce
      description: Use synthetic or de-identified data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
