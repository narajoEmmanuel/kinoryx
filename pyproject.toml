[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinoryx-gait-engine"
version = "0.1.0"
description = "Vendor-neutral foundations for gait sensor analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "KINORYX Contributors"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dashboard = ["dash>=2.17,<4", "plotly>=5.20,<7"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
kinoryx = "kinoryx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
